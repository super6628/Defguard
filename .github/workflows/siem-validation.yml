name: SIEM validation

on:
  push:
    branches:
      - feature/branding
    paths:
      - "web/**"
      - ".github/workflows/siem-validation.yml"
  workflow_dispatch:

jobs:
  validate-siem-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Generate paraglide messages
        working-directory: web
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide

      - name: Run SIEM tests
        working-directory: web
        run: pnpm vitest run src/pages/SiemPage tests/siem-export-and-notes.test.ts

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Lint frontend
        working-directory: web
        run: pnpm lint
