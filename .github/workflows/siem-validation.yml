name: SIEM validation

on:
  push:
    branches:
      - feature/branding
    paths:
      - "web/**"
      - ".github/workflows/siem-validation.yml"
  workflow_dispatch:

jobs:
  validate-siem-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run