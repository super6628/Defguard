name: S-Metric integration fix generator

on:
  push:
    branches:
      - feature/smetric-admin-sync-dev-20260910

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: feature/smetric-admin-sync-dev-20260910

      - name: Add S-Metric internal license exception
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("deny.toml")
          text = path.read_text()
          marker = '''    { allow = [\n        "AGPL-3.0-only",\n        "AGPL-3.0-or-later",\n    ], crate = "defguard_static_ip" },\n'''
          addition = marker + '''    { allow = [\n        "AGPL-3.0-only",\n        "AGPL-3.0-or-later",\n    ], crate = "smetric_features" },\n'''
          if 'crate = "smetric_features"' not in text:
              if marker not in text:
                  raise SystemExit("license exception insertion point not found")
              text = text.replace(marker, addition, 1)
              path.write_text(text)
          PY

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Commit generated files and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock deny.toml
          git rm .github/workflows/smetric-integration-fix.yml
          git commit -m "fix: refresh lockfile and license policy for S-Metric"
          git push origin HEAD:feature/smetric-admin-sync-dev-20260910
